name: Docker CI

on:
  push:
    branches:
      - devops

jobs:
  docker-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t streamlit-test .

      - name: Run Docker Container
        run: |
          docker run -d \
            --name streamlit-container \
            -p 8501:8501 \
            streamlit-test

      - name: Wait for Application
        run: sleep 10

      - name: Verify Container is Running
        run: |
          docker ps
          docker ps --filter "name=streamlit-container" --filter "status=running" | grep streamlit-container

      - name: Show Container Logs (if failure)
        if: failure()
        run: |
          docker logs streamlit-container || true

      - name: Stop and Remove Container
        if: always()
        run: |
          docker stop streamlit-container || true
          docker rm streamlit-container || true