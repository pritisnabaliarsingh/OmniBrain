name: Docker Build Verification

on:
  push:
    branches:
      - devops

permissions:
  contents: read
  issues: write

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Dockerfile Exists
        run: |
          if [ ! -f Dockerfile ]; then
            echo "Dockerfile not found!"
            exit 1
          fi

      - name: Build Docker Image
        run: |
          docker build -t ci-build:${{ github.sha }} .

      - name: Docker Build Successful
        run: |
          echo "✅ Docker image built successfully."

      - name: Create GitHub Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 CI Failure - Docker Build (${context.sha.substring(0,7)})`,
              body: `
## Docker Build Failed

A Docker build failed during CI.

### Repository
${context.repo.owner}/${context.repo.repo}

### Branch
${context.ref.replace('refs/heads/', '')}

### Commit
${context.sha}

### Triggered By
${context.actor}

### Workflow Logs
https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

Please investigate the Dockerfile or recent changes.
              `,
              labels: ["ci", "docker", "bug"]
            })