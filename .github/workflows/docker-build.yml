
    name: Docker Build & Run Verification

on:
  push:

permissions:
  contents: read
  issues: write

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Backend Dockerfile Exists
        run: |
          if [ ! -f backend/Dockerfile ]; then
            echo "Backend Dockerfile not found!"
            exit 1
          fi

      - name: Verify Gemini Configuration Source
        run: |
          echo "===== GIT COMMIT ====="
          git rev-parse HEAD

          echo "===== SETTINGS.PY ====="
          cat backend/app/config/settings.py

          echo "===== CHECK OLD GEMINI VALIDATION ====="
          if grep -q 'raise ValueError("GEMINI_API_KEY is not set")' backend/app/config/settings.py; then
            echo "ERROR: Old GEMINI_API_KEY validation is still present!"
            exit 1
          fi

          echo "GEMINI_API_KEY validation is not present."

      - name: Build Backend Docker Image
        run: |
          docker build \
            --no-cache \
            -t ci-build:${{ github.sha }} \
            ./backend

      - name: Verify Settings Inside Docker Image
        run: |
          docker run --rm \
            -e GEMINI_API_KEY=dummy_key \
            ci-build:${{ github.sha }} \
            cat /app/app/config/settings.py

      - name: Run Backend Container
        run: |
          docker run -d \
            --name ci-test-container \
            -p 8000:8000 \
            -e GEMINI_API_KEY=dummy_key \
            ci-build:${{ github.sha }}

          sleep 5

          echo "===== GEMINI ENVIRONMENT ====="
          docker inspect ci-test-container \
            --format='{{range .Config.Env}}{{println .}}{{end}}' | grep GEMINI || true

      - name: Check Container Is Running
        run: |
          if [ "$(docker inspect -f '{{.State.Running}}' ci-test-container)" != "true" ]; then
            echo "Container exited unexpectedly!"
            docker logs ci-test-container
            exit 1
          fi

          echo "Container is running."

      - name: Cleanup
        if: always()
        run: docker rm -f ci-test-container || true

      - name: Create GitHub Issue on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Docker Build/Run Failed on ${{ github.ref_name }}" \
            --body "## Docker Build or Run Failed

          **Repository:** ${{ github.repository }}
          **Branch:** ${{ github.ref_name }}
          **Commit:** ${{ github.sha }}
          **Triggered By:** ${{ github.actor }}

          **Workflow Logs:**
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Please investigate the Dockerfile or recent changes on this branch."